<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biodata - Adhikal Putra Perkasa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 500px;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      padding: 30px 20px;
      text-align: center;
    }

    .avatar-placeholder {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: #3b82f6;
      border: 4px solid #ffffff;
      margin: 0 auto 15px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .card-header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .card-header p {
      font-size: 0.9rem;
      color: #bfdbfe;
      margin-top: 4px;
    }

    .card-body {
      padding: 25px;
    }

    .info-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #334155;
    }

    .info-group:last-child {
      border-bottom: none;
    }

    .label {
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .value {
      color: #f8fafc;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: right;
    }

    .badge {
      background-color: #0369a1;
      color: #e0f2fe;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="avatar-placeholder">APP</div>
      <h1>Adhikal Putra Perkasa</h1>
      <p>Siswa Teknik Jaringan Komputer & Telekomunikasi</p>
    </div>
    
    <div class="card-body">
      <div class="info-group">
        <span class="label">Nama Lengkap</span>
        <span class="value">Adhikal Putra Perkasa</span>
      </div>

      <div class="info-group">
        <span class="label">Sekolah</span>
        <span class="value">SMK Taruna Bhakti</span>
      </div>

      <div class="info-group">
        <span class="label">Kelas</span>
        <span class="value"><span class="badge">X TJKT 4</span></span>
      </div>

      <div class="info-group">
        <span class="label">Tanggal Lahir</span>
        <span class="value">15 November 2009</span>
      </div>
    </div>
  </div>

</body>
</html>
